[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobagent"
version = "2.0.0-alpha.2"
description = "JobAgent 2.0 — shared job catalog with per-candidate matches"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "JobAgent" }]
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.0",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "feedparser>=6.0.11",
    "beautifulsoup4>=4.12.0",
    "anthropic>=0.25.0",
    "mistralai>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "httpx>=0.27.0",
]
playwright = [
    "playwright>=1.44.0",
]

[project.scripts]
jobagent = "jobagent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
jobagent = [
    "db/sql/*.sql",
    "web/templates/*.html",
    "web/static/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
